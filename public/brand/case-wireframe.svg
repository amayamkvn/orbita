<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9061F9" />
    </linearGradient>
    <pattern id="lightGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E7EB" stroke-width="0.8" stroke-opacity="0.8" />
    </pattern>
  </defs>

  <!-- Outer Browser Window Frame -->
  <rect x="2" y="2" width="796" height="516" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Dark Browser Header Chrome (as requested: only header is dark) -->
  <path d="M 2 16 C 2 8.268 8.268 2 16 2 L 784 2 C 791.732 2 798 8.268 798 16 L 798 48 L 2 48 Z" fill="#181C24" stroke="#252A36" stroke-width="1" />
  <line x1="2" y1="48" x2="798" y2="48" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- macOS Window Controls (Red, Yellow, Green) -->
  <circle cx="28" cy="25" r="5.5" fill="#EF4444" />
  <circle cx="46" cy="25" r="5.5" fill="#F59E0B" />
  <circle cx="64" cy="25" r="5.5" fill="#10B981" />

  <!-- Dark URL Bar / Breadcrumbs Wireframe -->
  <rect x="94" y="14" width="340" height="22" rx="6" fill="#0D0F14" stroke="#2B3242" stroke-width="1" />
  <circle cx="106" cy="25" r="3" fill="#7C3AED" />
  <line x1="116" y1="25" x2="190" y2="25" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Navigation Wireframe Tabs in Header -->
  <rect x="560" y="19" width="46" height="12" rx="3" fill="#334155" />
  <rect x="618" y="19" width="56" height="12" rx="3" fill="#334155" />
  <rect x="686" y="14" width="94" height="22" rx="6" fill="url(#primaryAccent)" />

  <!-- Canvas Content Area: WHITE BACKGROUND WITH LIGHT BLUEPRINT GRID -->
  <g transform="translate(0, 48)">
    <rect width="800" height="472" fill="#FFFFFF" />
    <rect width="800" height="472" fill="url(#lightGridPattern)" />

    <!-- Top Section: Hero Content Layout -->
    <g transform="translate(44, 32)">
      <!-- Left Column: Typography Block & Wireframe Elements -->
      <g>
        <!-- Pill tag -->
        <rect x="0" y="0" width="110" height="20" rx="10" fill="#F3E8FF" stroke="#DDD6FE" stroke-width="1" />
        <rect x="14" y="8" width="60" height="4" rx="2" fill="#7C3AED" />

        <!-- Bold Title Placeholder (Aa block inspired by wireframe reference) -->
        <text x="0" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#0F172A" letter-spacing="-1">Aa</text>
        <rect x="70" y="40" width="200" height="13" rx="3.5" fill="#0F172A" />
        <rect x="70" y="59" width="145" height="11" rx="3" fill="#64748B" />

        <!-- Paragraph lines wireframe -->
        <rect x="0" y="94" width="280" height="8" rx="4" fill="#94A3B8" />
        <rect x="0" y="110" width="250" height="8" rx="4" fill="#94A3B8" />
        <rect x="0" y="126" width="190" height="8" rx="4" fill="#CBD5E1" />

        <!-- CTA Buttons Wireframe -->
        <rect x="0" y="152" width="130" height="36" rx="8" fill="url(#primaryAccent)" />
        <rect x="24" y="166" width="82" height="8" rx="4" fill="#FFFFFF" />

        <rect x="142" y="152" width="116" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
        <rect x="164" y="166" width="72" height="8" rx="4" fill="#64748B" />
      </g>

      <!-- Right Column: Hero Media Container (Clean White Blueprint X Box) -->
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="372" height="188" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
        <!-- Diagonal wireframe crossed lines with precision -->
        <line x1="0" y1="0" x2="372" y2="188" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5" />
        <line x1="372" y1="0" x2="0" y2="188" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 5" />

        <!-- Center blueprint node -->
        <circle cx="186" cy="94" r="18" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" />
        <path d="M 179 94 L 193 94 M 186 87 L 186 101" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" />

        <!-- Dimension tag -->
        <rect x="14" y="14" width="72" height="18" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <text x="23" y="27" font-family="monospace" font-weight="600" font-size="9" fill="#64748B">HERO_FRAME</text>
      </g>
    </g>

    <!-- Horizontal Section Divider -->
    <line x1="44" y1="256" x2="756" y2="256" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Bottom Section: 3 Feature Cards (with wireframe X boxes) -->
    <g transform="translate(44, 276)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="224" height="126" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <rect x="14" y="14" width="48" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <line x1="14" y1="14" x2="62" y2="56" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2.5 2.5" />
        <line x1="62" y1="14" x2="14" y2="56" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2.5 2.5" />

        <rect x="72" y="20" width="134" height="10" rx="3.5" fill="#0F172A" />
        <rect x="72" y="36" width="95" height="8" rx="3" fill="#64748B" />

        <rect x="14" y="72" width="196" height="7" rx="3.5" fill="#94A3B8" />
        <rect x="14" y="85" width="168" height="7" rx="3.5" fill="#94A3B8" />
        <rect x="14" y="98" width="124" height="7" rx="3.5" fill="#CBD5E1" />
      </g>

      <!-- Card 2 (Active / Highlighted with Órbita Electric Violet Accent) -->
      <g transform="translate(244, 0)">
        <rect x="0" y="0" width="224" height="126" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" />
        <rect x="14" y="14" width="48" height="42" rx="6" fill="#F3E8FF" stroke="#A78BFA" stroke-width="1" />
        <line x1="14" y1="14" x2="62" y2="56" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="2.5 2.5" />
        <line x1="62" y1="14" x2="14" y2="56" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="2.5 2.5" />

        <rect x="72" y="20" width="134" height="10" rx="3.5" fill="#1E1B4B" />
        <rect x="72" y="36" width="95" height="8" rx="3" fill="#7C3AED" />

        <rect x="14" y="72" width="196" height="7" rx="3.5" fill="#7C3AED" fill-opacity="0.7" />
        <rect x="14" y="85" width="168" height="7" rx="3.5" fill="#7C3AED" fill-opacity="0.5" />
        <rect x="14" y="98" width="124" height="7" rx="3.5" fill="#C4B5FD" />
      </g>

      <!-- Card 3 -->
      <g transform="translate(488, 0)">
        <rect x="0" y="0" width="224" height="126" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <rect x="14" y="14" width="48" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <line x1="14" y1="14" x2="62" y2="56" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2.5 2.5" />
        <line x1="62" y1="14" x2="14" y2="56" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2.5 2.5" />

        <rect x="72" y="20" width="134" height="10" rx="3.5" fill="#0F172A" />
        <rect x="72" y="36" width="95" height="8" rx="3" fill="#64748B" />

        <rect x="14" y="72" width="196" height="7" rx="3.5" fill="#94A3B8" />
        <rect x="14" y="85" width="168" height="7" rx="3.5" fill="#94A3B8" />
        <rect x="14" y="98" width="124" height="7" rx="3.5" fill="#CBD5E1" />
      </g>
    </g>
  </g>
</svg>