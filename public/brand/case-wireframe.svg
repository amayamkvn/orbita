<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#161922" />
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9061F9" />
    </linearGradient>
    <linearGradient id="softFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2330" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#181B26" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#252A38" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" rx="16" fill="url(#bgGrad)" />
  <rect width="800" height="520" rx="16" fill="url(#gridPattern)" />

  <!-- Browser Frame Window -->
  <g transform="translate(40, 36)">
    <!-- Window Shadow & Background -->
    <rect x="0" y="0" width="720" height="448" rx="12" fill="#111319" stroke="#2A303F" stroke-width="1.5" />

    <!-- Window Header / Browser Chrome -->
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 708 0 C 714.627 0 720 5.373 720 12 L 720 44 L 0 44 Z" fill="#181C26" stroke="#2A303F" stroke-width="1" />
    <line x1="0" y1="44" x2="720" y2="44" stroke="#2A303F" stroke-width="1.5" />

    <!-- macOS Window Dots -->
    <circle cx="24" cy="22" r="5" fill="#EF4444" opacity="0.85" />
    <circle cx="40" cy="22" r="5" fill="#F59E0B" opacity="0.85" />
    <circle cx="56" cy="22" r="5" fill="#10B981" opacity="0.85" />

    <!-- URL Bar / Breadcrumb Wireframe -->
    <rect x="80" y="11" width="320" height="22" rx="6" fill="#0D0F14" stroke="#272D3B" stroke-width="1" />
    <line x1="96" y1="22" x2="160" y2="22" stroke="#4B5565" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="90" cy="22" r="2.5" fill="#7C3AED" />

    <!-- Navigation Wireframe Tabs -->
    <rect x="520" y="16" width="38" height="12" rx="3" fill="#2E3648" />
    <rect x="570" y="16" width="46" height="12" rx="3" fill="#2E3648" />
    <rect x="628" y="12" width="76" height="20" rx="5" fill="url(#primaryAccent)" />

    <!-- Canvas Inner Content Area -->
    <!-- Top Wireframe Header / Hero Layout -->
    <g transform="translate(36, 68)">
      <!-- Left Column: Typography & Content Hierarchy Wireframe -->
      <g>
        <!-- Pill tag -->
        <rect x="0" y="0" width="100" height="18" rx="9" fill="#1E1B4B" stroke="#4C1D95" stroke-width="1" />
        <rect x="12" y="7" width="55" height="4" rx="2" fill="#A78BFA" />

        <!-- Bold Title Placeholder (Aa block inspired by wireframe) -->
        <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#F3F4F6" letter-spacing="-0.5">Aa</text>
        <rect x="60" y="38" width="180" height="12" rx="3" fill="#F3F4F6" />
        <rect x="60" y="56" width="130" height="12" rx="3" fill="#9CA3AF" />

        <!-- Paragraph lines wireframe -->
        <rect x="0" y="86" width="260" height="7" rx="3.5" fill="#4B5565" />
        <rect x="0" y="100" width="235" height="7" rx="3.5" fill="#4B5565" />
        <rect x="0" y="114" width="180" height="7" rx="3.5" fill="#374151" />

        <!-- Action CTA Buttons Wireframe -->
        <rect x="0" y="140" width="118" height="34" rx="7" fill="url(#primaryAccent)" />
        <rect x="22" y="153" width="74" height="8" rx="4" fill="#FFFFFF" />

        <rect x="130" y="140" width="105" height="34" rx="7" fill="#1E2330" stroke="#374151" stroke-width="1" />
        <rect x="150" y="153" width="65" height="8" rx="4" fill="#9CA3AF" />
      </g>

      <!-- Right Column: Hero Media Container (Clean Blueprint X Wireframe Box) -->
      <g transform="translate(330, 0)">
        <!-- Image Box Frame -->
        <rect x="0" y="0" width="318" height="175" rx="8" fill="url(#softFill)" stroke="#374151" stroke-width="1.5" />
        <!-- Diagonal wireframe crossed lines with precision -->
        <line x1="0" y1="0" x2="318" y2="175" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 4" />
        <line x1="318" y1="0" x2="0" y2="175" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 4" />
        
        <!-- Center blueprint node -->
        <circle cx="159" cy="87.5" r="16" fill="#181C26" stroke="#4B5565" stroke-width="1.5" />
        <path d="M 153 87.5 L 165 87.5 M 159 81.5 L 159 93.5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" />

        <!-- Dimension tag -->
        <rect x="12" y="12" width="60" height="16" rx="4" fill="#111319" stroke="#2E3648" stroke-width="1" />
        <text x="21" y="24" font-family="monospace" font-size="9" fill="#9CA3AF">HERO_IMG</text>
      </g>
    </g>

    <!-- Horizontal Section Divider -->
    <line x1="36" y1="280" x2="684" y2="280" stroke="#252B3B" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Bottom Section: 3 Feature Cards (with wireframe X boxes as in reference) -->
    <g transform="translate(36, 302)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="202" height="118" rx="8" fill="#141822" stroke="#2A303F" stroke-width="1" />
        <!-- Wireframe Box thumbnail with X -->
        <rect x="14" y="14" width="46" height="40" rx="5" fill="#1C212E" stroke="#3B4457" stroke-width="1" />
        <line x1="14" y1="14" x2="60" y2="54" stroke="#3B4457" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="60" y1="14" x2="14" y2="54" stroke="#3B4457" stroke-width="1" stroke-dasharray="2 2" />

        <!-- Card Title -->
        <rect x="70" y="20" width="115" height="9" rx="3" fill="#E5E7EB" />
        <rect x="70" y="34" width="85" height="7" rx="3" fill="#6B7280" />

        <!-- Card Body Lines -->
        <rect x="14" y="68" width="174" height="6" rx="3" fill="#3B4457" />
        <rect x="14" y="80" width="150" height="6" rx="3" fill="#3B4457" />
        <rect x="14" y="92" width="110" height="6" rx="3" fill="#2E3648" />
      </g>

      <!-- Card 2 (Active / Highlighted) -->
      <g transform="translate(224, 0)">
        <rect x="0" y="0" width="202" height="118" rx="8" fill="#151926" stroke="#7C3AED" stroke-width="1.5" />
        <!-- Wireframe Box thumbnail with X -->
        <rect x="14" y="14" width="46" height="40" rx="5" fill="#1E1B4B" stroke="#6D28D9" stroke-width="1" />
        <line x1="14" y1="14" x2="60" y2="54" stroke="#7C3AED" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="60" y1="14" x2="14" y2="54" stroke="#7C3AED" stroke-width="1" stroke-dasharray="2 2" />

        <!-- Card Title -->
        <rect x="70" y="20" width="115" height="9" rx="3" fill="#FFFFFF" />
        <rect x="70" y="34" width="85" height="7" rx="3" fill="#C4B5FD" />

        <!-- Card Body Lines -->
        <rect x="14" y="68" width="174" height="6" rx="3" fill="#4B5565" />
        <rect x="14" y="80" width="150" height="6" rx="3" fill="#4B5565" />
        <rect x="14" y="92" width="110" height="6" rx="3" fill="#374151" />
      </g>

      <!-- Card 3 -->
      <g transform="translate(448, 0)">
        <rect x="0" y="0" width="200" height="118" rx="8" fill="#141822" stroke="#2A303F" stroke-width="1" />
        <!-- Wireframe Box thumbnail with X -->
        <rect x="14" y="14" width="46" height="40" rx="5" fill="#1C212E" stroke="#3B4457" stroke-width="1" />
        <line x1="14" y1="14" x2="60" y2="54" stroke="#3B4457" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="60" y1="14" x2="14" y2="54" stroke="#3B4457" stroke-width="1" stroke-dasharray="2 2" />

        <!-- Card Title -->
        <rect x="70" y="20" width="115" height="9" rx="3" fill="#E5E7EB" />
        <rect x="70" y="34" width="85" height="7" rx="3" fill="#6B7280" />

        <!-- Card Body Lines -->
        <rect x="14" y="68" width="172" height="6" rx="3" fill="#3B4457" />
        <rect x="14" y="80" width="145" height="6" rx="3" fill="#3B4457" />
        <rect x="14" y="92" width="105" height="6" rx="3" fill="#2E3648" />
      </g>
    </g>
  </g>
</svg>